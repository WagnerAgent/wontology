schema_version: 3.0.0
bundle_version: 2026.10.1
provider: gcp
rules:
- id: gcp.run_services
  native_type: run.googleapis.com/Service
  priority: 100
  semantic_type: compute.function
  domain: compute
  kind: resource
  role: runtime
  management_model: managed
  capabilities:
  - discovered
- id: gcp.buckets
  native_type: storage.googleapis.com/Bucket
  priority: 100
  semantic_type: storage.object.bucket
  domain: storage
  kind: resource
  role: supporting
  management_model: managed
  capabilities:
  - discovered
- id: gcp.container_clusters
  native_type: container.googleapis.com/Cluster
  priority: 100
  semantic_type: compute.container-cluster
  domain: compute
  kind: resource
  role: runtime
  management_model: managed
  capabilities:
  - discovered
- id: gcp.forwarding_rules
  native_type: compute.googleapis.com/ForwardingRule
  priority: 100
  semantic_type: network.load-balancer
  domain: network
  kind: resource
  role: supporting
  management_model: managed
  capabilities:
  - discovered
- id: gcp.firewalls
  native_type: compute.googleapis.com/Firewall
  priority: 100
  semantic_type: network.security-rule
  domain: security
  kind: resource
  role: supporting
  management_model: managed
  capabilities:
  - discovered
- id: gcp.disks
  native_type: compute.googleapis.com/Disk
  priority: 100
  semantic_type: storage.block.volume
  domain: storage
  kind: resource
  role: supporting
  management_model: managed
  capabilities:
  - discovered
- id: gcp.compute.instance
  native_type: compute.googleapis.com/Instance
  priority: 100
  semantic_type: compute.instance
  domain: compute
  kind: instance
  subtype: virtual-machine
  role: runtime
  management_model: self_managed
  capabilities:
  - workload
  - network_attached
- id: gcp.cloudsql.instance
  native_type: sqladmin.googleapis.com/Instance
  priority: 100
  semantic_type: data.database.instance
  domain: data
  kind: database
  subtype: relational
  role: runtime
  management_model: managed
  capabilities:
  - stores_data
  - network_endpoint
  - supports_backups
- id: gcp.compute.network
  native_type: compute.googleapis.com/Network
  priority: 100
  semantic_type: network.boundary
  domain: network
  kind: network
  subtype: vpc
  role: boundary
  management_model: self_managed
  capabilities:
