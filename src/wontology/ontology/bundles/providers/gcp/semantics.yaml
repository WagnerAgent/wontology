- id: gcp.compute.subnetwork
  native_type: compute.googleapis.com/Subnetwork
  priority: 100
  semantic_type: network.segment
  domain: network
  kind: network-segment
  subtype: subnet
  role: boundary
  management_model: self_managed
  capabilities:
  - network_segment
- id: gcp.provider-fallback
  native_type_glob: '*.googleapis.com/*'
  priority: 0
  semantic_type: gcp.resource
  domain: unknown
  kind: resource
  role: supporting
  management_model: unknown
  status: provider_specific
  capabilities:
  - discovered
  - requires_hydration
