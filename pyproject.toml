[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wontology"
version = "0.1.0"
description = "Your cloud infrastructure, mapped. A local, evidence-backed ontology explorer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Steve Suarez"}]
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "jmespath>=1.0.1,<2",
  "boto3>=1.35,<2", "azure-identity>=1.19,<2",
  "google-auth>=2.38,<3", "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "build>=1.2,<2", "setuptools>=77", "wheel"]

[project.scripts]
wontology = "wontology.__main__:main"

[project.urls]
Repository = "https://github.com/wagneragent/wontology"
Issues = "https://github.com/wagneragent/wontology/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wontology = ["static/*", "static/fonts/*", "static/icons/*.svg", "ontology/specs/*.yaml", "ontology/bundles/**/*.yaml", "ontology/bundles/**/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
