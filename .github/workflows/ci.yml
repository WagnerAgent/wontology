name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build --no-isolation
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../src/wontology/static/
      - run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wontology:ci .
      - run: docker run -d --name wontology --publish 127.0.0.1:8787:8787 wontology:ci
      - name: Verify packaged UI and all provider examples
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time
          from http.cookiejar import CookieJar
          from urllib.request import build_opener, HTTPCookieProcessor
          client = build_opener(HTTPCookieProcessor(CookieJar()))
          base = 'http://127.0.0.1:8787'
          for attempt in range(40):
              try:
                  assert b'Wontology' in client.open(base, timeout=2).read()
                  break
              except OSError:
                  if attempt == 39:
                      raise
                  time.sleep(.25)
          for provider in ('aws', 'azure', 'gcp'):
              snapshot = json.load(client.open(f'{base}/api/demo?provider={provider}', timeout=5))
              assert snapshot['resources'] and snapshot['relationships']
          for asset in ('app.js', 'app.css', 'fonts/Inter.ttf', 'fonts/SpaceGrotesk-Variable.ttf', 'icons/network.svg'):
              assert client.open(f'{base}/{asset}', timeout=5).read()
          print('Container startup, bundled UI, fonts, and three provider examples passed')
          PY
      - if: always()
        run: docker logs wontology; docker rm -f wontology
